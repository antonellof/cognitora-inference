# cgn-agent for llama3-8b · cgn-infer (Cognitora native engine) · single node.
#
# Set LLAMA_GGUF=/abs/path/to/model.gguf in the environment, or replace
# the placeholder under [models."Meta-Llama-3.1-8B-Instruct"].path.

[cluster]
name           = "cognitora-llama3-8b-cgninfer"
state_backend  = "etcd"
etcd_endpoints = ["http://127.0.0.1:2379"]

[security]
require_mtls = false

[auth]
enabled = false

[agent]
listen   = "127.0.0.1:7080"
role     = "both"
node_id  = "agent-llama3-8b-cgninfer"
kv_uds   = "/tmp/cognitora-kv.sock"

[engine]
kind = "cgn_infer"
url  = "http://127.0.0.1:8001"

[engine.cgn_infer]
binary_path = "cgn-infer"   # PATH-name or absolute path to the binary
host        = "127.0.0.1"
port        = 8001
ctx         = 8192
threads     = 8

[models."Meta-Llama-3.1-8B-Instruct"]
tp            = 1
max_model_len = 8192
# Path to a Llama-3.1 GGUF. Override via $LLAMA_GGUF before running up.sh.
path          = "${LLAMA_GGUF}"
