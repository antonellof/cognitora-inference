[package]
name = "cgn-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Cognitora native inference engine: GGUF models via Candle, OpenAI-compatible HTTP/SSE"

[[bin]]
name = "cgn-infer"
path = "src/main.rs"

[lib]
name = "cgn_infer"
path = "src/lib.rs"

[features]
default = []
# GPU backends, forwarded to Candle. CPU is always available.
metal = ["candle-core/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-transformers/cuda"]

[dependencies]
cgn-core      = { workspace = true }
cgn-telemetry = { workspace = true }
cgn-proto     = { workspace = true }
cgn-tls       = { workspace = true }

candle-core         = "0.9"
candle-transformers = "0.9"
candle-nn           = "0.9"
half                = "2"
memmap2             = "0.9"
minijinja           = { version = "2.21", features = ["json"] }

tonic = { workspace = true }
prost = { workspace = true }

tokio        = { workspace = true }
tokio-stream = { workspace = true }
futures      = { workspace = true }
async-stream = { workspace = true }
axum         = { workspace = true }
tokenizers   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
clap         = { workspace = true }
uuid         = { workspace = true }
blake3       = { workspace = true }
chrono       = { workspace = true }
rand         = "0.8"
anyhow       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
