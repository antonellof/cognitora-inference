name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev clang lld pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: cargo build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev clang lld pkg-config
      - run: cargo build --workspace --release

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev clang lld pkg-config
      - run: cargo test --workspace --no-fail-fast

  e2e-multinode:
    name: e2e multi-node (etcd)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev clang lld pkg-config
      - name: Install etcd + etcdctl
        run: |
          ETCD_VER=v3.5.15
          curl -fsSL "https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz" \
            | tar xz -C /tmp
          sudo install /tmp/etcd-${ETCD_VER}-linux-amd64/etcd /tmp/etcd-${ETCD_VER}-linux-amd64/etcdctl /usr/local/bin/
      - name: Start etcd
        run: |
          etcd --data-dir /tmp/etcd-e2e \
            --listen-client-urls http://127.0.0.1:2379 \
            --advertise-client-urls http://127.0.0.1:2379 \
            --logger zap --log-level error &
          for _ in $(seq 1 30); do
            etcdctl --endpoints=127.0.0.1:2379 endpoint health >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "etcd did not become healthy" >&2
          exit 1
      - name: Build cgn-router + cgn-agent
        run: cargo build --release --no-default-features -p cgn-router -p cgn-agent
      - name: Multi-node KV routing smoke
        run: CGN_E2E_MULTINODE=1 CGN_SKIP_BUILD=1 ./tests/e2e/multi_node_kv.sh

  helm-lint:
    name: helm lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.15.0 }
      - run: helm lint deploy/kubernetes/helm/cognitora

  bench-validate:
    name: bench harness (no GPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/bench/validate-local.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck \
            deploy/installer/install.sh \
            scripts/bench/disagg/run.sh \
            scripts/bench/energy/run.sh \
            scripts/bench/validate-local.sh \
            scripts/e2e-gpu.sh \
            tests/e2e/single_node.sh \
            tests/e2e/multi_node_kv.sh
