{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cognitora.fullname" . }}-agent
  labels:
    {{- include "cognitora.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "cognitora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "cognitora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "cognitora.fullname" . }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.agent.hostNetwork }}
      {{- if and .Values.lmcache.enabled (eq .Values.lmcache.mode "mp") .Values.agent.engine.enabled (not .Values.lmcache.isolatedIPC) }}
      # Legacy CUDA IPC. vLLM and the node-local LMCache server share the
      # host IPC namespace so cudaIpcOpenMemHandle can open the server's
      # tensors. Do not mount an emptyDir at /dev/shm — it would hide the
      # host tmpfs.
      hostIPC: true
      {{- end }}
      containers:
        - name: cgn-agent
          image: {{ include "cognitora.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/usr/local/bin/cgn-agent"]
          args:
            - --config
            - /etc/cognitora/cognitora.toml
          ports:
            - { name: grpc,  containerPort: 7071 }
            - { name: admin, containerPort: 9091 }
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/cognitora }
            {{- if .Values.security.require_mtls }}
            - { name: pki,    mountPath: /etc/cognitora/pki, readOnly: true }
            {{- end }}
            - { name: socks,  mountPath: /run/cognitora }
        {{- if .Values.agent.engine.enabled }}
        # Inference engine sidecar. Owns the engine process; the agent
        # proxies to it on http://127.0.0.1:{{ .Values.agent.engine.port }}
        # ([engine] kind = "openai_compat" in the rendered config).
        - name: engine
          image: {{ required "agent.engine.image is required when agent.engine.enabled=true" .Values.agent.engine.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- if and .Values.lmcache.enabled (eq .Values.lmcache.mode "mp") }}
          {{- if .Values.agent.engine.command }}
          {{- fail "lmcache.mode=mp injects the vLLM entrypoint; leave agent.engine.command empty and put model flags in agent.engine.args" }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cfg="$(cat /etc/lmcache/kv-transfer-config.json)"
              if [ -n "${HOST_IP:-}" ]; then
                cfg="$(printf '%s' "$cfg" | sed "s/__LMCACHE_HOST__/${HOST_IP}/g")"
              fi
              set -- vllm serve "$@" --kv-transfer-config "$cfg"
              {{ if .Values.lmcache.disablePrefixCaching }}
              set -- "$@" --no-enable-prefix-caching
              {{ end }}
              {{ if .Values.lmcache.disableHybridKvCacheManager }}
              set -- "$@" --disable-hybrid-kv-cache-manager
              {{ end }}
              exec "$@"
            - --
            {{- with .Values.agent.engine.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else }}
          {{- with .Values.agent.engine.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.agent.engine.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if or .Values.lmcache.enabled .Values.agent.engine.env }}
          env:
            {{- if .Values.lmcache.enabled }}
            - name: PYTHONHASHSEED
              value: "0"
            {{- end }}
            {{- if and .Values.lmcache.enabled (eq .Values.lmcache.mode "mp") (not .Values.lmcache.externalConfigMap) }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- end }}
            {{- with .Values.agent.engine.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if and .Values.lmcache.enabled (eq .Values.lmcache.mode "mp") (not .Values.lmcache.isolatedIPC) }}
          securityContext:
            runAsUser: 0
          {{- end }}
          ports:
            - { name: engine, containerPort: {{ .Values.agent.engine.port }} }
          {{- if .Values.agent.engine.readinessPath }}
          readinessProbe:
            httpGet:
              path: {{ .Values.agent.engine.readinessPath }}
              port: engine
            periodSeconds: 5
            failureThreshold: 60   # engines warm slowly while loading weights
          {{- end }}
          {{- with .Values.agent.engine.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and .Values.lmcache.enabled (eq .Values.lmcache.mode "mp") }}
          volumeMounts:
            - name: kv-transfer-config
              mountPath: /etc/lmcache
              readOnly: true
            {{- if .Values.lmcache.isolatedIPC }}
            - name: lmcache-dev-shm
              mountPath: /dev/shm
            {{- end }}
          {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ include "cognitora.fullname" . }}-config }
        {{- if .Values.security.require_mtls }}
        - name: pki
          secret:
            secretName: {{ default (printf "%s-pki" (include "cognitora.fullname" .)) .Values.pki.existingSecret }}
        {{- end }}
        - name: socks
          emptyDir: {}
        {{- if and .Values.lmcache.enabled (eq .Values.lmcache.mode "mp") .Values.agent.engine.enabled }}
        - name: kv-transfer-config
          configMap:
            name: {{ .Values.lmcache.externalConfigMap | default (printf "%s-lmcache-connection" (include "cognitora.fullname" .)) }}
        {{- if .Values.lmcache.isolatedIPC }}
        - name: lmcache-dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.lmcache.shmSize }}
        {{- end }}
        {{- end }}
{{- end }}
