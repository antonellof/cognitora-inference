[cluster]
name           = "cognitora-mac-native"
state_backend  = "etcd"
etcd_endpoints = ["http://127.0.0.1:2379"]

[security]
require_mtls = false

[auth]
enabled = false

[router]
listen_http  = "127.0.0.1:8080"
listen_grpc  = "127.0.0.1:9090"
listen_admin = "127.0.0.1:9091"
node_id      = "router-mac-native"

[router.score_weights]
kv       = 0.55
load     = 0.25
power    = 0.10
capacity = 0.10

[router.admission]
max_queue                  = 128
ttft_slo                   = "5s"
max_concurrent_per_replica = 2

[models."llama-3.2-3b-instruct"]
tp = 1
